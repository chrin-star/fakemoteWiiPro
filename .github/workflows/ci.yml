name: CI Switch Pro experimental

on:
  push:
    branches: [switch-pro-usb-experimental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use EGC with Nintendo Switch USB driver (test only)
        run: |
          git -C embedded-game-controller fetch origin bb1b9832d887c3c2ca7ede5e873f525e1fef7d10
          git -C embedded-game-controller checkout bb1b9832d887c3c2ca7ede5e873f525e1fef7d10
          git -C embedded-game-controller submodule update --init --recursive
      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y g++ wget
          wget https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.sh
          chmod +x cmake-4.0.2-linux-x86_64.sh
          ./cmake-4.0.2-linux-x86_64.sh --skip-license --prefix=/usr/local
          wget https://raw.githubusercontent.com/Leseratte10/d2xl-cios/master/stripios/main.cpp
          g++ main.cpp -o stripios
          mv stripios ${DEVKITPRO}/tools/bin
      
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.build_type }}
          -DWITH_BLUETOOTH=OFF
          -DWITH_DRIVER_DS3=OFF
          -DWITH_DRIVER_DS4=OFF
          -DWITH_DRIVER_GENERIC=OFF
          -DWITH_GENERIC_MAPPINGS=OFF
          -DWITH_DRIVER_NINTENDO_SWITCH=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: Fakemote_SwitchPro_${{ matrix.build_type }}_${{ github.sha }}
          if-no-files-found: error
          path: build/${{ matrix.build_type }}/FAKEMOTE.app
