name: CI Switch Pro experimental

on:
  push:
    branches: [switch-pro-usb-experimental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use EGC with Nintendo Switch USB driver (test only)
        run: |
          git -C embedded-game-controller fetch origin bb1b9832d887c3c2ca7ede5e873f525e1fef7d10
          git -C embedded-game-controller checkout bb1b9832d887c3c2ca7ede5e873f525e1fef7d10
          git -C embedded-game-controller submodule update --init --recursive
      
      - name: Fix Switch Pro physical B mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("embedded-game-controller/embedded-game-controller/hid_drivers/nintendo_switch.c")
          s = p.read_text()

          # Report 0x30: use a dedicated internal button.
          old = "[NS_BUTTON_B] = EGC_GAMEPAD_BUTTON_SOUTH,"
          new = "[NS_BUTTON_B] = EGC_GAMEPAD_BUTTON_RIGHT_PADDLE2,"
          assert s.count(old) == 1, "0x30 mapping not found"
          s = s.replace(old, new, 1)

          # Report 0x3F: use the same internal button.
          pattern = r"(EGC_GAMEPAD_BUTTON_NORTH,\s+EGC_GAMEPAD_BUTTON_WEST,\s+EGC_GAMEPAD_BUTTON_EAST,\s+)EGC_GAMEPAD_BUTTON_SOUTH,"
          replacement = r"\1EGC_GAMEPAD_BUTTON_RIGHT_PADDLE2,"
          s, count = re.subn(pattern, replacement, s, count=1)
          assert count == 1, "0x3F mapping not found"

          
          


          
          # Modify only the Switch Pro descriptor.
          start = s.index("s_device_description_pro =")
          end = s.index(".available_axes =", start)
          section = s[start:end]

          old = "BIT(EGC_GAMEPAD_BUTTON_SOUTH) |"
          new = old + "\n        BIT(EGC_GAMEPAD_BUTTON_RIGHT_PADDLE2) |"

          assert section.count(old) == 1
          section = section.replace(old, new, 1)
          s = s[:start] + section + s[end:]

          p.write_text(s)
          print("Switch Pro B mapping and descriptor patch applied")

          PY

      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y g++ wget
          wget https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.sh
          chmod +x cmake-4.0.2-linux-x86_64.sh
          ./cmake-4.0.2-linux-x86_64.sh --skip-license --prefix=/usr/local
          wget https://raw.githubusercontent.com/Leseratte10/d2xl-cios/master/stripios/main.cpp
          g++ main.cpp -o stripios
          mv stripios ${DEVKITPRO}/tools/bin
      
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.build_type }}
          -DWITH_BLUETOOTH=OFF
          -DWITH_DRIVER_DS3=OFF
          -DWITH_DRIVER_DS4=OFF
          -DWITH_DRIVER_GENERIC=OFF
          -DWITH_GENERIC_MAPPINGS=OFF
          -DWITH_DRIVER_NINTENDO_SWITCH=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: Fakemote_SwitchPro_${{ matrix.build_type }}_${{ github.sha }}
          if-no-files-found: error
          path: build/${{ matrix.build_type }}/FAKEMOTE.app
