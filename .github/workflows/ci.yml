name: CI Switch Pro experimental

on:
  push:
    branches: [switch-pro-usb-experimental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use EGC with Nintendo Switch USB driver (test only)
        run: |
          git -C embedded-game-controller fetch origin bb1b9832d887c3c2ca7ede5e873f525e1fef7d10
          git -C embedded-game-controller checkout bb1b9832d887c3c2ca7ede5e873f525e1fef7d10
          git -C embedded-game-controller submodule update --init --recursive
      

      - name: Fix unmapped Switch Pro buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("embedded-game-controller/embedded-game-controller/hid_drivers/nintendo_switch.c")
          s = p.read_text()

          start = s.index("s_button_map_pro[")
          end = s.index("s_button_map_ljc[", start)
          section = s[start:end]

          anchor = "[NS_BUTTON_UP] = EGC_GAMEPAD_BUTTON_DPAD_UP,"
          assert section.count(anchor) == 1

          fix = (
              "[NS_BUTTON_SR_R] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_SL_R] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_SR_L] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_SL_L] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_UNUSED0] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_UNUSED1] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    "
          )

          section = section.replace(anchor, fix + anchor, 1)
          s = s[:start] + section + s[end:]

          p.write_text(s)
          print("Unmapped Switch Pro buttons fixed")
          PY

      
      - name: Test IOS57 USB HID fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("embedded-game-controller/embedded-game-controller/backends/ogc.c")
          s = p.read_text()

          old = '    ret = os_open("/dev/usb/hid", 15);'

          new = (
              '    ret = os_open("/dev/usb/hid", 15);\n'
              '    if (ret < 0) {\n'
              '        EGC_DEBUG("USB HID mode 15 failed: %d", ret);\n'
              '        ret = os_open("/dev/usb/hid", 0);\n'
              '    }'
          )

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s)
          print("USB HID fallback patch applied")
          PY


      - name: Test USB reconnect cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("embedded-game-controller/embedded-game-controller/backends/ogc.c")
          s = p.read_text()

          old = '''static void ogc_device_free(ogc_device_t *device)
          {
              PUB(device)->connection = EGC_CONNECTION_DISCONNECTED;'''

          new = '''static void ogc_device_free(ogc_device_t *device)
          {
              /* Ignore callbacks from transfers belonging to a removed device. */
              for (int i = 0; i < ARRAY_SIZE(s_transfers); i++) {
                  if (s_transfers[i].t.device == PUB(device))
                      s_transfers[i].callback = NULL;
              }

              PUB(device)->connection = EGC_CONNECTION_DISCONNECTED;'''

          assert s.count(old) == 1, "Device cleanup anchor not found"
          s = s.replace(old, new, 1)

          old = '''                    ogc_device_t *device = ogc_device_from_input_device(transfer->t.device);
                      if (device->usb.dev_id != 0 && transfer->callback) {'''

          # Match the original source indentation independently.
          anchor = '                    ogc_device_t *device = ogc_device_from_input_device(transfer->t.device);'
          assert s.count(anchor) == 1, "Transfer reply anchor not found"

          s = s.replace(
              anchor,
              '''                    ogc_device_t *device = transfer->t.device
                          ? ogc_device_from_input_device(transfer->t.device)
                          : NULL;''',
              1
          )

          old = 'if (device->usb.dev_id != 0 && transfer->callback) {'
          new = 'if (device && device->usb.dev_id != 0 && transfer->callback) {'
          assert s.count(old) == 1, "Transfer callback anchor not found"
          s = s.replace(old, new, 1)

          p.write_text(s)
          print("Experimental USB reconnect cleanup applied")
          PY


      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y g++ wget
          wget https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.sh
          chmod +x cmake-4.0.2-linux-x86_64.sh
          ./cmake-4.0.2-linux-x86_64.sh --skip-license --prefix=/usr/local
          wget https://raw.githubusercontent.com/Leseratte10/d2xl-cios/master/stripios/main.cpp
          g++ main.cpp -o stripios
          mv stripios ${DEVKITPRO}/tools/bin
      
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.build_type }}
          -DWITH_BLUETOOTH=OFF
          -DWITH_DRIVER_DS3=OFF
          -DWITH_DRIVER_DS4=OFF
          -DWITH_DRIVER_GENERIC=OFF
          -DWITH_GENERIC_MAPPINGS=OFF
          -DWITH_DRIVER_NINTENDO_SWITCH=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: Fakemote_SwitchPro_${{ matrix.build_type }}_${{ github.sha }}
          if-no-files-found: error
          path: build/${{ matrix.build_type }}/FAKEMOTE.app
