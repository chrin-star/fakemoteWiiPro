name: CI Switch Pro experimental

on:
  push:
    branches: [switch-pro-usb-experimental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Download my EGC fork
        run: |
          git -C embedded-game-controller remote set-url origin https://github.com/chrin-star/embedded-game-controller.git
          git -C embedded-game-controller fetch origin master
          git -C embedded-game-controller checkout --detach FETCH_HEAD

          echo "EGC version downloaded:"
          git -C embedded-game-controller log -1 --oneline

          echo "Checking required files:"
          test -f embedded-game-controller/embedded-game-controller/hid_drivers/nintendo_switch.c
          test -f embedded-game-controller/embedded-game-controller/backends/ogc.c


      - name: Inspect EGC directory
        run: |
          echo "Contenido del submódulo:"
          ls -la embedded-game-controller
          echo "Buscando archivos del driver:"
          find embedded-game-controller \( -name "nintendo_switch.c" -o -name "ogc.c" \)

      
      - name: Fix unmapped Switch Pro buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("embedded-game-controller/embedded-game-controller/hid_drivers/nintendo_switch.c")
          s = p.read_text()

          start = s.index("s_button_map_pro[")
          end = s.index("s_button_map_ljc[", start)
          section = s[start:end]

          anchor = "[NS_BUTTON_UP] = EGC_GAMEPAD_BUTTON_DPAD_UP,"
          assert section.count(anchor) == 1

          fix = (
              "[NS_BUTTON_SR_R] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_SL_R] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_SR_L] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_SL_L] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_UNUSED0] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    [NS_BUTTON_UNUSED1] = EGC_GAMEPAD_BUTTON_INVALID,\n"
              "    "
          )

          section = section.replace(anchor, fix + anchor, 1)
          s = s[:start] + section + s[end:]

          p.write_text(s)
          print("Unmapped Switch Pro buttons fixed")
          PY

      
      - name: Test IOS57 USB HID fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("embedded-game-controller/embedded-game-controller/backends/ogc.c")
          s = p.read_text()

          old = '    ret = os_open("/dev/usb/hid", 15);'

          new = (
              '    ret = os_open("/dev/usb/hid", 15);\n'
              '    if (ret < 0) {\n'
              '        EGC_DEBUG("USB HID mode 15 failed: %d", ret);\n'
              '        ret = os_open("/dev/usb/hid", 0);\n'
              '    }'
          )

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s)
          print("USB HID fallback patch applied")
          PY



      - name: Test disconnected USB transfer guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("embedded-game-controller/embedded-game-controller/backends/ogc.c")
          s = p.read_text()

          anchor = "ogc_device_t *device = ogc_device_from_input_device(transfer->t.device);"
          assert s.count(anchor) == 1, "USB device lookup not found uniquely"

          lines = s.splitlines()
          index = next(i for i, line in enumerate(lines) if anchor in line)
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]

          lines[index:index + 1] = [
              indent + "ogc_device_t *device = transfer->t.device",
              indent + "    ? ogc_device_from_input_device(transfer->t.device)",
              indent + "    : NULL;"
          ]

          s = "\n".join(lines) + "\n"

          old = "if (device->usb.dev_id != 0 && transfer->callback) {"
          new = (
              "if (device && "
              "PUB(device)->connection == EGC_CONNECTION_USB && "
              "device->usb.dev_id != 0 && transfer->callback) {"
          )

          assert s.count(old) == 1, "USB transfer condition not found uniquely"
          s = s.replace(old, new, 1)

          p.write_text(s)
          print("Disconnected USB transfer guard applied")
          PY



      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y g++ wget
          wget https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.sh
          chmod +x cmake-4.0.2-linux-x86_64.sh
          ./cmake-4.0.2-linux-x86_64.sh --skip-license --prefix=/usr/local
          wget https://raw.githubusercontent.com/Leseratte10/d2xl-cios/master/stripios/main.cpp
          g++ main.cpp -o stripios
          mv stripios ${DEVKITPRO}/tools/bin
      
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.build_type }}
          -DWITH_BLUETOOTH=OFF
          -DWITH_DRIVER_DS3=OFF
          -DWITH_DRIVER_DS4=OFF
          -DWITH_DRIVER_GENERIC=OFF
          -DWITH_GENERIC_MAPPINGS=OFF
          -DWITH_DRIVER_NINTENDO_SWITCH=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: Fakemote_SwitchPro_${{ matrix.build_type }}_${{ github.sha }}
          if-no-files-found: error
          path: build/${{ matrix.build_type }}/FAKEMOTE.app
